<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Produtos</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <h1>Comparador de Produtos</h1>
    <p>Digite as informações do produto quando solicitado.</p>

    <!-- Seu script JavaScript -->
    <script src="Compara Produtos.js"></script>

    <div class="container">
        <div class="produtos-wrapper">
            <div class="produto">
                <h2>Produto 1</h2>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="nome1" placeholder="Nome do produto">
                    </div>
                    <div class="form-group">
                        <input type="number" step="0.01" id="valor1" placeholder="Valor">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group peso-group">
                        <input type="number" step="0.01" id="peso1" placeholder="Peso">
                        <select id="medida1">
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="mg">mg</option>
                        </select>
                    </div>
                </div>
                <button onclick="removerProduto(this)" class="btn-remover" title="Remover produto">
                    <i class="fas fa-trash"></i>
                </button>
            </div>

            <div class="produto">
                <h2>Produto 2</h2>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="nome2" placeholder="Nome do produto">
                    </div>
                    <div class="form-group">
                        <input type="number" step="0.01" id="valor2" placeholder="Valor">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group peso-group">
                        <input type="number" step="0.01" id="peso2" placeholder="Peso">
                        <select id="medida2">
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="mg">mg</option>
                        </select>
                    </div>
                </div>
                <button onclick="removerProduto(this)" class="btn-remover" title="Remover produto">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
        <button onclick="adicionarProduto()" style="margin-bottom: 10px;">Adicionar Novo Produto</button>

        <button onclick="compararProdutos()">Comparar Produtos</button>
        <div id="resultado"></div>
    </div>
</body>

</html>
